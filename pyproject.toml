[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tele-agent"
version = "0.1.0"
description = "Agent-first Telegram operations assistant for an Indian kirana store"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "groq>=0.31.0",
  "python-telegram-bot>=21.10",
  "SQLAlchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "pydantic-settings>=2.7.1",
  "tenacity>=9.0.0",
  "reportlab>=4.2.5",
  "python-pptx>=1.0.2",
  "matplotlib>=3.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
]

[project.scripts]
tele-agent = "app.main:main"
tele-agent-seed = "scripts.seed:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
